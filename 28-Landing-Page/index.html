<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <title>TechStart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav>
        <div class="logo">🚀 TechStart</div>

        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#features">Features</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>

        <div class="nav-right">
            <button id="darkToggle">🌙</button>
            <div class="hamburger" onclick="toggleMenu()">☰</div>
        </div>
    </nav>
</header>

<!-- HERO -->
<section id="home" class="hero">
    <div class="hero-content">
        <h1>Build Stunning Websites 🚀</h1>
        <p>Modern tools + AI + speed = next-gen web development.</p>

        <div class="hero-buttons">
            <button class="btn primary">Get Started</button>
            <button class="btn outline">Live Demo</button>
        </div>
    </div>

    <div class="hero-image">
        <img src="https://via.placeholder.com/500x400" alt="">
    </div>
</section>

<!-- FEATURES -->
<section id="features" class="features">
    <h2>✨ Features</h2>

    <div class="features-grid">
        <div class="card">🚀 Fast Performance</div>
        <div class="card">📱 Responsive</div>
        <div class="card">🔒 Secure</div>
        <div class="card">🎨 Modern UI</div>
    </div>
</section>

<!-- CTA -->
<section class="cta">
    <h2>Start Building Today</h2>
    <button class="btn primary large">Free Trial</button>
</section>

<footer id="contact">
    <p>© 2026 TechStart | Made with ❤️</p>
</footer>

<script src="script.js"></script>
</body>
</html>
