<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day-9 Position Practice</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<h1>Position Practice</h1>
    <div class="container">

        <div class="img-box">
            <img src="nature-1.png" alt="Mountain landscape">
            <span class="caption">Mountain View</span>
        </div>

        <div class="img-box absolute-img">
            <img src="nature-2.png" alt="Forest scenery">
            <span class="caption">Forest</span>
        </div>

        <div class="img-box fixed-img">
            <img src="nature-3.png" alt="Ocean view">
            <span class="caption">Ocean</span>
        </div>

        <div class="img-box sticky-img">
            <img src="nature-4.png" alt="Sunset view">
            <span class="caption">Sunset</span>
        </div>

    </div>

    <!-- Extra content to show sticky effect -->
    <div class="spacer"></div>

</body>
</html>
